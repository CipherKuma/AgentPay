[project]
name = "agentpay"
version = "0.1.0"
description = "Python SDK for AgentPay - AI compute marketplace with x402 payments"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "AgentPay Team", email = "team@agentpay.io" }
]
keywords = ["ai", "compute", "marketplace", "x402", "payments", "movement"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "PyNaCl>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/agentpay/agentpay-sdk"
Documentation = "https://docs.agentpay.io"
Repository = "https://github.com/agentpay/agentpay-sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentpay"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
