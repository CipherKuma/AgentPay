version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentpay
      POSTGRES_USER: agentpay
      POSTGRES_PASSWORD: agentpay_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentpay"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "4402:4402"
    environment:
      - NODE_ENV=production
      - PORT=4402
      - DATABASE_URL=postgresql://agentpay:agentpay_dev@postgres:5432/agentpay
      - CORS_ORIGIN=http://localhost:3000
      - MOVEMENT_PAY_TO=${MOVEMENT_PAY_TO}
      - MOVEMENT_FACILITATOR_URL=${MOVEMENT_FACILITATOR_URL:-https://facilitator.x402.org}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4402/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4402
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: agentpay-network
