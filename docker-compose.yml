version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "4402:4402"
    environment:
      - NODE_ENV=production
      - PORT=4402
      - MOVEMENT_PAY_TO=${MOVEMENT_PAY_TO}
      - MOVEMENT_FACILITATOR_URL=${MOVEMENT_FACILITATOR_URL:-https://facilitator.x402.org}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4402/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4402
    depends_on:
      - server
    restart: unless-stopped

networks:
  default:
    name: agentpay-network
